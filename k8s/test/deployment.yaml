apiVersion: v1
kind: Namespace
metadata:
  name: vk-bot-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vk-bot
  namespace: vk-bot-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vk-bot
  template:
    metadata:
      labels:
        app: vk-bot
    spec:
      containers:
        - name: vk-bot
          image: igalx/vk-bot:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: vk-bot-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: vk-bot
  namespace: vk-bot-test
spec:
  selector:
    app: vk-bot
  ports:
    - port: 80
      targetPort: 8080
  type: NodePort
