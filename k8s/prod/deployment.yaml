apiVersion: v1
kind: Namespace
metadata:
  name: vk-bot-prod
---
apiVersion: v1
kind: Secret
metadata:
  name: vk-bot-secrets
  namespace: vk-bot-prod
type: Opaque
stringData:
  VK_TOKEN: "токен_боевого_сообщества"
  VK_GROUP_ID: "987654321"
  VK_CONFIRMATION_TOKEN: "строка_подтверждения"
  VK_SECRET_KEY: ""
  WALL_POST_ID: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vk-bot
  namespace: vk-bot-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vk-bot
  template:
    metadata:
      labels:
        app: vk-bot
    spec:
      containers:
        - name: vk-bot
          image: vk-bot:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: vk-bot-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: vk-bot
  namespace: vk-bot-prod
spec:
  selector:
    app: vk-bot
  ports:
    - port: 80
      targetPort: 8080
  type: NodePort
